    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<body>
    <nav class="navbar navbar-expand-lg navbar-alvorecer sticky-top py-2">

                <img src="img/logo.png" alt="Logo">

                <a href="index.html" class="nav-link d-inline">Início</a>
                
                <a href="contato.html" class="nav-link d-inline active">Contato</a>
            </div>
        </div>
    </nav>

    <section class="service-hero py-5">
        <div class="container py-5">
            <p class="section-kicker">FALE CONOSCO</p>
            <h1 class="text-white display-3">Solicite seu orçamento</h1>
        </div>
    </section>

    <main class="py-5">
        <div class="container">
            <div class="row g-4">

                <div class="col-lg-5">
                    <div class="info-box p-4 rounded">
                        <h2 class="section-title">Contato</h2>

                        <p>
                            <i class="bi bi-telephone text-gold"></i>
                            (49) 98823-8448
                        </p>

                        <p>
                            <i class="bi bi-envelope text-gold"></i>
                            vinicius.gcunha98@gmail.com
                        </p>

                        <p>
                            <i class="bi bi-geo-alt text-gold"></i>
                            Chapecó - SC
                        </p>

                        <a
                            href="https://wa.me/5549988238448"
                            target="_blank"
                            class="btn btn-gold"
                        >
                            <i class="bi bi-whatsapp"></i>
                            Chamar no WhatsApp
                        </a>
                    </div>
                </div>
                <div class="col-lg-7">
                    <div class="bg-white p-4 rounded shadow-sm">
                        <h2 class="section-title">Pedido de orçamento</h2>

                        <form>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Nome</label>
                                    <input
                                        class="form-control"
                                        placeholder="Seu nome"
                                    >
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Telefone</label>
                                    <input
                                        class="form-control"
                                        placeholder="(49) ..."
                                    >
                                </div>

                                <div class="col-12">
                                    <label class="form-label">Tipo de serviço</label>

                                    <select class="form-select">
                                        <option>Pintura Residencial</option>
                                        <option>Pintura Comercial</option>
                                        <option>Pintura de Fachadas</option>
                                    </select>
                                </div>

                                <div class="col-12">
                                    <label class="form-label">Mensagem</label>

                                    <textarea
                                        class="form-control"
                                        rows="5"
                                        placeholder="Conte brevemente sobre o ambiente e o serviço desejado"
                                    ></textarea>
                                </div>

                                <div class="col-12">
                                    <a
                                        href="https://wa.me/5549988238448"
                                        target="_blank"
                                        class="btn btn-gold"
                                    >
                                        Enviar pelo WhatsApp
                                    </a>
